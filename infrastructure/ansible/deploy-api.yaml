- name: Desired directory state
  hosts: lab
  become: true

  tasks:
    - name: Verify the guest is Debian
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] == 'Debian'

    - name: Ensure the API directory exists
      ansible.builtin.file:
        path: /opt/dsl-api
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Deploy the API executable
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../.local/artifacts/dsl-api/health-api"
        dest: /opt/dsl-api/health-api
        owner: root
        group: root
        mode: "0755"
      notify: Restart API

    - name: Deploy the service definition
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../systemd/dsl-api.service"
        dest: /etc/systemd/system/dsl-api.service
        owner: root
        group: root
        mode: "0644"
      notify:
        - Reload systemd
        - Restart API

    - name: Apply pending service changes
      ansible.builtin.meta: flush_handlers

    - name: Ensure the API is running
      ansible.builtin.systemd_service:
        name: dsl-api.service
        state: started

    - name: Wait for the API health endpoint
      ansible.builtin.uri:
        url: http://127.0.0.1:8080/healthz
        status_code: [200]
        timeout: 2
      register: api_health
      until: api_health is succeeded
      retries: 5
      delay: 1

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: Restart API
      ansible.builtin.systemd_service:
        name: dsl-api.service
        state: restarted
